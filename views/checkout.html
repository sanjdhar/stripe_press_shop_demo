{% extends 'layouts/main.html' %}

{% block content %}
<div class="row justify-content-md-center">
  <div class="col-6">
    <div class="text-center mt-40">
      <h1>
        Checkout — Stripe Press
      </h1>
      <h5 class="text-secondary">
        {{ title }}
      </h5>
      <hr class="mt-40">
      <div class="mt-20 text-info">
        Total due: $<span class="amount" data-amount="{{ amount }}"></span>
      </div>
    </div>
    {% if client_secret %}
    <div class="card box-shadow mt-40">
      <div class="card-body">
        <form name="payment-form" id="payment-form" data-publishable-key="{{ stripe_publishable_key }}" data-client-secret="{{ client_secret }}" data-return-url="{{ url_for('success', _external=True) }}">
          <div>
            <label for="email">Email address</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="you@email.com" required>
          </div>
          <div id="payment-element" class="mt-20"></div>
          <div id="payment-message" class="mt-20 text-danger" role="alert"></div>
          <div class="mt-20">
            <button type="submit" id="submit" class="btn btn-lg btn-block btn-primary">Pay $<span class="amount" data-amount="{{ amount }}"></span></button>
          </div>
        </form>
      </div>
    </div>
    {% endif %}
  </div>
</div>
{% endblock %}
